<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Node Graph Editor</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Nodes are real <div>s positioned via style.left/top, wires are one <svg>
     overlay redrawn only on the specific interaction that moved something
     (drag, connect, spawn) -- no requestAnimationFrame loop, no per-frame
     canvas redraw. Same reasoning as the original read-only version of this
     page: this competes with real training/generation work for the same
     hardware, so it only does work when something actually changed. */

  html, body { height: 100%; margin: 0; }

  .ng-topbar { padding: 16px 24px 8px; }
  .ng-topbar h1 { font-size: 20px; color: var(--text); margin: 0; }
  .ng-topbar p { color: var(--text-dim); font-size: 13px; margin: 4px 0 0; }

  .ng-legend {
    display: flex; gap: 20px; padding: 8px 24px; font-size: 12px;
    color: var(--text-dim); align-items: center; border-bottom: 1px solid var(--border);
  }
  .ng-legend-item { display: flex; align-items: center; gap: 6px; }

  .ng-app { display: flex; height: calc(100vh - 132px); }

  .ng-palette {
    width: 240px; flex-shrink: 0; overflow-y: auto; padding: 12px;
    border-right: 1px solid var(--border); background: var(--surface);
  }
  .ng-palette-group { margin-bottom: 14px; }
  .ng-palette-group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .ng-palette-item {
    display: block; width: 100%; text-align: left; padding: 6px 8px;
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 12px;
    font-family: 'JetBrains Mono', monospace; cursor: pointer; margin-bottom: 4px;
  }
  .ng-palette-item:hover { border-color: var(--accent); }

  .ng-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .ng-toolbar {
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center;
  }
  .ng-toolbar button {
    padding: 6px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); font-size: 13px; cursor: pointer;
  }
  #ng-run-btn { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  #ng-run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #ng-run-status { font-size: 12px; color: var(--text-dim); }

  .ng-canvas-wrap {
    flex: 1; overflow: auto; position: relative;
    background:
      linear-gradient(var(--border) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0 / 24px 24px;
    background-color: var(--bg);
  }
  .ng-canvas { position: relative; width: 3200px; height: 2000px; }
  .ng-wires { position: absolute; top: 0; left: 0; width: 3200px; height: 2000px; pointer-events: none; }
  .ng-wires path.ng-wire { stroke: var(--accent); stroke-width: 2; fill: none; pointer-events: stroke; cursor: pointer; }
  .ng-wires path.ng-wire:hover { stroke: var(--red); }
  .ng-wires path.ng-pending { stroke: var(--text-dim); stroke-width: 2; stroke-dasharray: 4 3; fill: none; }

  .ng-node {
    position: absolute; width: 270px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); user-select: none;
  }
  .ng-node-header { background: var(--surface-alt); padding: 8px 30px 8px 12px; cursor: grab; position: relative; }
  .ng-node-header:active { cursor: grabbing; }
  .ng-node-title { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; color: var(--text); }
  .ng-node-module { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .ng-node-del {
    position: absolute; top: 6px; right: 8px; background: none; border: none;
    color: var(--text-dim); cursor: pointer; font-size: 15px; line-height: 1;
  }
  .ng-node-del:hover { color: var(--red); }
  .ng-node-doc { font-size: 11px; color: var(--text-dim); padding: 6px 12px; border-bottom: 1px solid var(--border); font-style: italic; }

  .ng-ports-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); padding: 4px 12px 2px; }
  .ng-port { display: flex; align-items: center; gap: 6px; padding: 3px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; position: relative; }
  .ng-port.output { flex-direction: row-reverse; text-align: right; }
  .ng-port-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; cursor: crosshair;
    background: var(--surface); border: 2px solid var(--accent);
  }
  .ng-port-dot.output { background: var(--green); border-color: var(--green); }
  .ng-port-dot.required-unmet { border-color: var(--red); }
  .ng-port-dot.connected { background: var(--green); border-color: var(--green); }
  .ng-port-name { color: var(--text); }
  .ng-port-type { color: var(--text-dim); margin-left: auto; font-size: 10px; }
  .ng-port.output .ng-port-type { margin-left: 0; margin-right: auto; }
  .ng-port-hint { color: var(--text-dim); font-size: 10px; font-style: italic; margin-left: auto; }

  .ng-widget-row { padding: 0 12px 4px 28px; }
  .ng-widget-row input[type=text], .ng-widget-row input[type=number] {
    width: 100%; box-sizing: border-box; font-size: 11px; padding: 3px 6px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text);
  }

  .ng-results { max-height: 240px; overflow-y: auto; border-top: 1px solid var(--border); padding: 10px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .ng-result-line { padding: 3px 0; }
  .ng-result-ok { color: var(--green); }
  .ng-result-err { color: var(--red); }
  .ng-result-skip { color: var(--text-dim); }
</style>
</head>
<body>
  <div class="ng-topbar">
    <h1>Node Graph Editor</h1>
    <p>Spawn nodes from the palette, drag between ports to connect, Run when every required input is filled.</p>
  </div>

  <div class="ng-legend">
    <div class="ng-legend-item"><span class="ng-port-dot"></span> optional input</div>
    <div class="ng-legend-item"><span class="ng-port-dot required-unmet"></span> required, unmet</div>
    <div class="ng-legend-item"><span class="ng-port-dot connected"></span> connected</div>
    <div class="ng-legend-item"><span class="ng-port-dot output"></span> output</div>
  </div>

  <div class="ng-app">
    <aside class="ng-palette" id="ng-palette">Loading...</aside>
    <div class="ng-main">
      <div class="ng-toolbar">
        <button id="ng-run-btn">Run</button>
        <button id="ng-clear-btn">Clear</button>
        <span id="ng-run-status"></span>
      </div>
      <div class="ng-canvas-wrap" id="ng-canvas-wrap">
        <svg class="ng-wires" id="ng-wires"></svg>
        <div class="ng-canvas" id="ng-canvas"></div>
      </div>
      <div class="ng-results" id="ng-results"></div>
    </div>
  </div>

  <script src="/static/nodegraph.js"></script>
</body>
</html>
