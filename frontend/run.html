<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run detail</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/ui/css/style.css">
    <link rel="stylesheet" href="/ui/css/shell.css">
    <link rel="stylesheet" href="/ui/css/run.css">
</head>
<body class="layout-fixed">
    <main class="content-area">
        <header class="page-topbar">
            <h1 id="run-title">Run #—</h1>
            <div id="status-badge" class="status-badge status-idle">—</div>
            <span class="page-sub" id="run-sub"></span>
            <a class="btn btn-secondary btn-small" href="/">← System tracker</a>
        </header>

        <div class="page-body">
            <div class="state-box" id="run-state">Loading…</div>

            <div class="run-grid" id="run-grid" hidden>
                <section class="card">
                    <div class="card-header"><span>Details</span></div>
                    <dl class="run-details" id="run-details"></dl>
                </section>

                <section class="card">
                    <div class="card-header">
                        <span>Log tail <span class="text-dim">(last 500 lines)</span></span>
                        <button id="btn-refresh-log" class="btn btn-secondary btn-small">Refresh</button>
                    </div>
                    <div class="log-pane" id="log-body"
                         data-empty="No log text for this run."></div>
                </section>
            </div>
        </div>
    </main>

    <script type="module" src="/ui/js/shell.js"></script>
    <script type="module" src="/ui/js/views/run.js"></script>
</body>
</html>
