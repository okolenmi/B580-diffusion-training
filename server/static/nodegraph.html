<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Node Graph Editor</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Nodes are real <div>s positioned via style.left/top, wires are one <svg>
     overlay redrawn only on the specific interaction that moved something
     (drag, connect, spawn) -- no requestAnimationFrame loop, no per-frame
     canvas redraw. Same reasoning as the original read-only version of this
     page: this competes with real training/generation work for the same
     hardware, so it only does work when something actually changed. */

  html, body { height: 100%; margin: 0; }

  .ng-topbar { padding: 16px 24px 8px; }
  .ng-topbar h1 { font-size: 20px; color: var(--text); margin: 0; }
  .ng-topbar p { color: var(--text-dim); font-size: 13px; margin: 4px 0 0; }

  .ng-legend {
    display: flex; gap: 20px; padding: 8px 24px; font-size: 12px;
    color: var(--text-dim); align-items: center; border-bottom: 1px solid var(--border);
  }
  .ng-legend-item { display: flex; align-items: center; gap: 6px; }

  .ng-app { display: flex; height: calc(100vh - 132px); }

  .ng-palette {
    width: 240px; flex-shrink: 0; overflow-y: auto; padding: 12px;
    border-right: 1px solid var(--border); background: var(--surface);
  }
  .ng-palette-group { margin-bottom: 14px; }
  .ng-palette-group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .ng-palette-item {
    display: block; width: 100%; text-align: left; padding: 6px 8px;
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 12px;
    font-family: 'JetBrains Mono', monospace; cursor: pointer; margin-bottom: 4px;
  }
  .ng-palette-item:hover { border-color: var(--accent); }

  .ng-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .ng-toolbar {
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center;
  }
  .ng-toolbar button {
    padding: 6px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); font-size: 13px; cursor: pointer;
  }
  #ng-run-btn { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  #ng-run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #ng-stop-btn { background: #b33; color: #fff; border-color: #b33; font-weight: 600; }
  #ng-stop-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #ng-run-status { font-size: 12px; color: var(--text-dim); }

  .ng-canvas-wrap {
    flex: 1; overflow: hidden; position: relative; cursor: grab;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 24px 24px; /* fixed -- deliberately NOT multiplied by zoom, so the grid
      never gets denser/sparser or blurs at odd scales. background-position is updated in JS
      (GraphView.applyViewportTransform) to track panX/panY 1:1, so it still visibly pans with
      the content -- just doesn't zoom with it. This lives on canvas-wrap (the untransformed
      viewport container, not .ng-canvas) specifically so it always covers the full visible
      area regardless of where node coordinates happen to be. */
  }
  .ng-canvas-wrap.panning { cursor: grabbing; }
  .ng-viewport { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .ng-canvas { position: relative; width: 3200px; height: 2000px; }
  .ng-wires, .ng-wires-top {
    position: absolute; top: 0; left: 0; width: 3200px; height: 2000px; pointer-events: none;
    overflow: visible; /* nodes/wires can legitimately sit outside this nominal box
      (dragged far, or the view panned past it) -- without this the SVG clips
      any path outside its own declared width/height, which looked like wires
      vanishing behind an invisible border. */
  }
  /* .ng-wires sits below .ng-canvas in DOM order (drawn first -> painted first
     -> behind nodes), .ng-wires-top sits above it (drawn last -> painted last
     -> in front of nodes). Completed connections stay behind node bodies so
     they don't visually clutter them; the wire actively being dragged goes on
     .ng-wires-top so it's never occluded while you're aiming it at a port. */
  .ng-wires path.ng-wire { stroke: var(--accent); stroke-width: 2; fill: none; pointer-events: stroke; cursor: pointer; }
  .ng-wires path.ng-wire:hover { stroke: var(--red); }
  .ng-wires-top path.ng-pending { stroke: var(--text-dim); stroke-width: 2; stroke-dasharray: 4 3; fill: none; }
  .ng-origin-marker { stroke: var(--text-dim); stroke-width: 1.5; fill: none; opacity: 0.5; }

  .ng-port-dot.compatible-target {
    box-shadow: 0 0 0 5px var(--accent-glow);
    transform: scale(1.35);
  }

  .ng-zoom-controls {
    position: absolute; bottom: 16px; right: 16px; z-index: 5;
    display: flex; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .ng-zoom-controls button, .ng-zoom-controls .ng-zoom-pct {
    padding: 6px 10px; background: var(--surface); border: none; border-right: 1px solid var(--border);
    color: var(--text); font-size: 12px; cursor: pointer; font-family: 'JetBrains Mono', monospace;
  }
  .ng-zoom-controls button:last-child { border-right: none; }
  .ng-zoom-controls button:hover { background: var(--surface-alt); }
  .ng-zoom-pct { cursor: default; color: var(--text-dim); min-width: 44px; text-align: center; }

  .ng-node {
    position: absolute; width: 270px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); user-select: none;
  }
  .ng-node-header { background: var(--surface-alt); padding: 8px 10px; cursor: grab; }
  .ng-node-header:active { cursor: grabbing; }
  /* A distinct controls cluster on its own row, separate from the title --
     same rounded-pill-with-dividers language as .ng-zoom-controls above,
     so it reads as "the same kind of control" wherever it shows up in this
     UI. Previously these buttons shared a flex row with the title itself,
     which could pack them uncomfortably close together on longer class
     names; splitting the row removes any competition for space entirely. */
  .ng-node-toolbar {
    display: flex; justify-content: center; width: fit-content; margin: 0 auto 6px;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .ng-node-title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; color: var(--text);
  }
  .ng-node-module { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
  .ng-node-del {
    flex-shrink: 0; background: none; border: none; border-left: 1px solid var(--border);
    padding: 0 6px; height: 22px; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); cursor: pointer; font-size: 15px; line-height: 1;
  }
  .ng-node-del:hover { color: var(--red); }
  .ng-mode-btn {
    width: 24px; height: 22px; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; /* real box-centering --
      the previous line-height trick left symbol glyphs (▲ ● •) sitting visibly low,
      since their font metrics aren't vertically symmetric the way line-height assumes */
    font-size: 13px; line-height: 1;
    background: var(--bg); border: none; border-right: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer;
  }
  .ng-mode-btn.active { background: var(--accent); color: var(--bg); }
  .ng-node-doc { font-size: 11px; color: var(--text-dim); padding: 6px 12px; border-bottom: 1px solid var(--border); font-style: italic; }

  .ng-node-compact .ng-port { padding: 2px 12px; }
  .ng-node-minimized .ng-ports-label { display: none; }
  .ng-min-columns { display: flex; padding: 4px 0; }
  .ng-min-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ng-min-col-outputs { align-items: flex-end; }
  .ng-node-minimized .ng-port-dotonly { padding: 3px 12px; display: flex; }
  .ng-node-minimized .ng-port-dotonly.output { justify-content: flex-end; }

  .ng-monitor-controls {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-top: 1px solid var(--border); font-size: 11px;
  }
  .ng-lookinside-btn {
    padding: 3px 8px; font-size: 10px; border-radius: 4px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); cursor: pointer; white-space: nowrap;
  }
  .ng-lookinside-btn:hover { background: var(--accent); color: var(--bg); }
  .ng-monitor-quickinfo {
    color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .ng-ports-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); padding: 4px 12px 2px; }
  .ng-port { display: flex; align-items: center; gap: 6px; padding: 3px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; position: relative; }
  .ng-port.output { flex-direction: row-reverse; text-align: right; }
  .ng-port-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; cursor: crosshair;
    background: var(--surface); border: 2px solid var(--accent);
  }
  .ng-port-dot.output { background: var(--green); border-color: var(--green); }
  .ng-port-dot.required-unmet { border-color: var(--red); }
  .ng-port-dot.connected { background: var(--green); border-color: var(--green); }
  .ng-port-name { color: var(--text); }
  .ng-port-type { color: var(--text-dim); margin-left: auto; font-size: 10px; }
  .ng-port.output .ng-port-type { margin-left: 0; margin-right: auto; }
  .ng-port-hint { color: var(--text-dim); font-size: 10px; font-style: italic; margin-left: auto; }

  .ng-widget-row { padding: 0 12px 4px 28px; }
  .ng-widget-row input[type=text], .ng-widget-row input[type=number], .ng-widget-row select {
    width: 100%; box-sizing: border-box; font-size: 11px; padding: 3px 6px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text);
  }
  /* Removed, not restyled: neither engine exposes the spinner button's own
     colors to CSS, so there's no way to make the stock white-with-gray-arrows
     control match a dark theme -- only whether it's shown at all. */
  .ng-widget-row input[type=number] { -moz-appearance: textfield; }
  .ng-widget-row input[type=number]::-webkit-outer-spin-button,
  .ng-widget-row input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .ng-checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text); }
  .ng-checkbox-label input[type=checkbox] { width: 13px; height: 13px; margin: 0; accent-color: var(--accent); }
  .ng-picker-row { display: flex; gap: 4px; }
  .ng-picker-row select { flex: 1; min-width: 0; }
  .ng-picker-upload {
    flex-shrink: 0; padding: 3px 8px; font-size: 11px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--surface-alt); color: var(--text-dim); cursor: pointer;
  }
  .ng-picker-upload:hover { color: var(--text); border-color: var(--accent); }

  .ng-results { max-height: 240px; overflow-y: auto; border-top: 1px solid var(--border); padding: 10px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .ng-result-line { padding: 3px 0; }
  .ng-result-ok { color: var(--green); }
  .ng-result-err { color: var(--red); }
  .ng-result-skip { color: var(--text-dim); }

  .ng-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100;
    background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
  }
  .ng-modal {
    width: 420px; max-width: 90vw; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  .ng-modal-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
  .ng-modal-crumbs { color: var(--text-dim); margin-bottom: 8px; }
  .ng-crumb { cursor: pointer; color: var(--accent); }
  .ng-crumb:hover { text-decoration: underline; }
  .ng-modal-list {
    max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px;
    margin-bottom: 10px; background: var(--bg);
  }
  .ng-modal-entry { padding: 5px 10px; cursor: pointer; color: var(--text); }
  .ng-modal-entry:hover { background: var(--surface-alt); }
  .ng-modal-empty { padding: 10px; color: var(--text-dim); font-style: italic; }
  .ng-modal-newfolder { display: flex; gap: 6px; margin-bottom: 10px; }
  .ng-modal-newfolder input { flex: 1; min-width: 0; }
  .ng-modal-filename { margin-bottom: 14px; }
  .ng-modal-filename label { display: block; color: var(--text-dim); margin-bottom: 4px; }
  .ng-modal input[type=text] {
    width: 100%; box-sizing: border-box; padding: 5px 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .ng-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .ng-modal-actions button, .ng-modal-newfolder button {
    padding: 6px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); font-size: 12px; cursor: pointer;
  }
  #ng-modal-save { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

  .ng-suggest-menu {
    position: fixed; z-index: 90; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden;
    max-height: 260px; overflow-y: auto; min-width: 200px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  .ng-suggest-header { padding: 6px 10px; color: var(--text-dim); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
  .ng-suggest-item { padding: 7px 10px; cursor: pointer; color: var(--text); border-bottom: 1px solid var(--border); }
  .ng-suggest-item:last-child { border-bottom: none; }
  .ng-suggest-item:hover { background: var(--surface-alt); }
  .ng-suggest-item-port { color: var(--text-dim); font-size: 10px; }
  .ng-suggest-empty { padding: 10px; color: var(--text-dim); font-style: italic; }
</style>
</head>
<body>
  <div class="ng-topbar">
    <h1>Node Graph Editor</h1>
    <p>Spawn nodes from the palette, drag between ports to connect, Run when every required input is filled.</p>
  </div>

  <div class="ng-legend">
    <div class="ng-legend-item"><span class="ng-port-dot"></span> optional input</div>
    <div class="ng-legend-item"><span class="ng-port-dot required-unmet"></span> required, unmet</div>
    <div class="ng-legend-item"><span class="ng-port-dot connected"></span> connected</div>
    <div class="ng-legend-item"><span class="ng-port-dot output"></span> output</div>
  </div>

  <div class="ng-app">
    <aside class="ng-palette" id="ng-palette">Loading...</aside>
    <div class="ng-main">
      <div class="ng-toolbar">
        <button id="ng-run-btn">Run</button>
        <button id="ng-stop-btn" style="display:none;">Stop</button>
        <button id="ng-clear-btn">Clear</button>
        <span id="ng-run-status"></span>
      </div>
      <div class="ng-canvas-wrap" id="ng-canvas-wrap">
        <div class="ng-viewport" id="ng-viewport">
          <svg class="ng-wires" id="ng-wires"></svg>
          <div class="ng-canvas" id="ng-canvas"></div>
          <svg class="ng-wires-top" id="ng-wires-top"></svg>
        </div>
        <div class="ng-zoom-controls">
          <button id="ng-zoom-out" title="Zoom out 10%">&minus;</button>
          <span class="ng-zoom-pct" id="ng-zoom-pct" title="Reset to 100%">100%</span>
          <button id="ng-zoom-in" title="Zoom in 10%">+</button>
        </div>
      </div>
      <div class="ng-results" id="ng-results"></div>
    </div>
  </div>

  <script src="/static/nodegraph.js"></script>
</body>
</html>
