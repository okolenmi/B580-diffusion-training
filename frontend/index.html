<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusion training</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/ui/css/style.css">
    <link rel="stylesheet" href="/ui/css/shell.css">
</head>
<body class="layout-fixed">
    <main class="content-area">
        <header class="page-topbar">
            <h1>Diffusion training</h1>
            <span class="page-sub">LoRA training runs from a saved graph</span>
        </header>

        <div class="page-body">
            <section class="hero">
                <h2>Start training in the graph editor</h2>
                <p class="text-dim">
                    Training is a graph execution. Build or open a graph, then run it
                    &mdash; the execution page streams progress and lets you stop it.
                </p>
                <p>
                    <a class="btn btn-start" href="/graph">Open graph editor →</a>
                </p>
            </section>

            <!-- Routes, not filenames. These were /graph.html and friends,
                 which the server never served: pages are registered at
                 /graph, /datasets, /config, /settings and /help, so every
                 link here was a 404 and the landing page could not be
                 navigated away from.

                 No Monitor link: that page is /monitor/{monitor_id} and a
                 landing page has no monitor id to name. It is reached from
                 the graph editor ("Look inside" on a monitor node), which
                 is the only place the id exists. Linking to a placeholder
                 would be worse than not linking. -->
            <nav class="page-nav">
                <a href="/graph">Graph editor</a>
                <a href="/datasets">Datasets</a>
                <a href="/config">Config</a>
                <a href="/settings">Settings</a>
                <a href="/help">Help</a>
            </nav>
        </div>
    </main>
</body>
</html>
